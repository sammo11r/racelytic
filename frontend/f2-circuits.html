<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse every Formula 2 circuit in Racelytic.">
  <link rel="icon" href="/assets/favicon-f2.svg" type="image/svg+xml">
  <title>Formula 2 Circuits · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/polish.css">
</head>
<body class="f2-mode">
  <div id="header"></div>
  <main class="container page">
    <div class="page-head"><div><div class="eyebrow">FORMULA 2 TRACKS &amp; VENUES</div><h1>Circuits</h1><p>Every circuit that has hosted a Formula 2 championship weekend.</p></div><input class="search" id="f2-circuit-search" type="search" aria-label="Search Formula 2 circuits" placeholder="Search circuits or locations..."></div>
    <div class="browser-toolbar"><span id="f2-circuit-count" class="browser-count">Loading circuits…</span><label class="sort-control">Sort <select id="f2-circuit-sort"><option value="name">Name</option><option value="recent">Most recent</option><option value="weekends">Most weekends</option></select></label></div>
    <div id="f2-circuits" class="entity-grid"></div>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/f2-circuit-images.js"></script>
  <script src="/js/f2-circuits.js"></script>

</html>
