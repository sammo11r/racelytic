<!doctype html><html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Name every Formula 1 Constructors' Champion.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Racelytic</title>
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css">
</head><body>
  <div id="header"></div>
  <main class="container page champions-quiz-page constructor-champions-quiz-page">
    <section class="quiz-game-head"><div><h1>Constructors’ champions</h1><p>Enter any Constructors’ Champion. Every season won by that constructor will be revealed.</p></div></section>
    <form id="constructor-guess-form" class="quiz-guess-form quiz-play-bar" autocomplete="off">
      <div class="quiz-play-progress" aria-live="polite"><span>Seasons found</span><strong id="quiz-score">0 / —</strong><div class="quiz-progress-track" aria-hidden="true"><i id="quiz-progress-fill"></i></div></div>
      <div class="quiz-play-input"><label for="constructor-guess">Constructor name</label><div><input id="constructor-guess" name="guess" placeholder="e.g. Ferrari" maxlength="100" disabled required><button type="submit" disabled>Submit guess</button></div></div>
      <div class="quiz-play-actions"><span id="quiz-save-status">Saved on this device</span><button id="quiz-reset" type="button">Reset</button><button id="quiz-reveal" type="button">Give up</button></div>
      <p id="quiz-feedback" aria-live="polite"></p>
    </form>
    <section class="quiz-table-section">
      <div class="quiz-table-heading"><div><h2>Complete the table</h2></div><details class="guessed-panel"><summary>Constructors found <span id="guessed-answer-count">0</span></summary><div id="guessed-answers" class="guessed-drivers"></div></details></div>
      <div id="quiz-decade-filters" class="quiz-decade-filters" aria-label="Filter championship seasons by decade"></div>
      <aside id="quiz-completion" class="quiz-completion" hidden><div><span id="quiz-completion-label">Quiz complete</span><h2 id="quiz-completion-title">Perfect score</h2><p id="quiz-completion-copy"></p></div><div><button id="quiz-play-again" type="button">Play again</button><a href="/season-race-winners-quiz">Try Winners by season →</a></div></aside>
      <div id="constructor-champions-quiz-board" class="champions-quiz-board dynamic-quiz-board"><div class="loading-state">Loading seasons…</div></div>
    </section>
  </main>
  <dialog id="quiz-confirm-dialog" class="quiz-confirm-dialog" aria-labelledby="quiz-confirm-title" aria-describedby="quiz-confirm-copy"><form method="dialog"><div class="quiz-confirm-mark" aria-hidden="true">!</div><div><span>CONFIRM ACTION</span><h2 id="quiz-confirm-title"></h2><p id="quiz-confirm-copy"></p></div><div class="quiz-confirm-actions"><button value="cancel">Cancel</button><button id="quiz-confirm-submit" value="confirm">Confirm</button></div></form></dialog>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script><script src="/js/header.js"></script><script src="/js/constructor-champions-quiz.js"></script>
</body></html>
