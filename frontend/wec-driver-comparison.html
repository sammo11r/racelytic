<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Compare two FIA World Endurance Championship drivers across class results, shared races and same-entry crew history.">
  <link rel="icon" href="/assets/favicon-wec.svg" type="image/svg+xml">
  <title>WEC Driver Comparison · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css"><link rel="stylesheet" href="/css/driver-comparison.css"><link rel="stylesheet" href="/css/wec.css"><link rel="stylesheet" href="/css/wec-driver-comparison.css">
</head>
<body class="wec-mode" data-wec-view="driver-comparison"><div id="header"></div>
<main class="container page analysis-detail-page comparison-page wec-driver-comparison-page">
  <header class="comparison-page-head">
    <div><div class="eyebrow">WEC · DRIVER COMPARISON</div><h1 id="wec-comparison-title">Compare drivers</h1><p>Class-aware careers, shared events and time spent in the same endurance-racing crew.</p></div>
    <div class="comparison-head-actions"><button id="wec-copy-comparison-link" type="button" disabled>Copy link</button></div>
  </header>
  <section class="comparison-picker" aria-label="Choose WEC drivers">
    <label for="wec-comparison-driver-one"><span>First driver</span><select id="wec-comparison-driver-one" disabled><option>Loading drivers…</option></select></label>
    <button id="wec-swap-drivers" class="comparison-swap" type="button" aria-label="Swap drivers" title="Swap drivers" disabled>⇄</button>
    <label for="wec-comparison-driver-two"><span>Second driver</span><select id="wec-comparison-driver-two" disabled><option>Loading drivers…</option></select></label>
  </section>
  <p id="wec-comparison-status" class="analysis-status" role="status">Loading WEC drivers…</p>
  <div id="wec-comparison-content"></div>
</main>
<footer class="footer"><div class="container">Racelytic</div></footer>
<script src="/js/utils.js"></script><script src="/js/header.js"></script><script src="/js/wec-driver-comparison-model.js"></script><script src="/js/wec-driver-comparison.js"></script>
</body></html>
