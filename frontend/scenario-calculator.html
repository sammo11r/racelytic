<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Rewrite future Formula 1 results and explore how every championship scenario changes the title outlook.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>Formula 1 scenario calculator · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/polish.css">
  <link rel="stylesheet" href="/css/scenario-calculator.css">
</head>
<body>
  <div id="header"></div>
  <main class="container page scenario-page">
    <header class="scenario-page-heading">
      <div class="eyebrow">CHAMPIONSHIP SCENARIOS</div>
      <h1>Rewrite the title run-in</h1>
      <p>Choose where the official standings stop, predict the remaining results and follow the title outlook live.</p>
    </header>

    <section class="scenario-setup" aria-label="Scenario settings">
      <div class="scenario-controls">
        <label><span>Season</span><select id="scenario-season"><option>Loading seasons…</option></select></label>
        <label><span>Official standings after</span><select id="scenario-cutoff"></select></label>
        <label><span>Points system</span><select id="scenario-points"><option value="modern">Modern · 25–18–15–12–10–8–6–4–2–1</option><option value="2003">2003–2009 · 10–8–6–5–4–3–2–1</option><option value="1991">1991–2002 · 10–6–4–3–2–1</option><option value="classic">Classic · 9–6–4–3–2–1</option></select><small><a id="scenario-manage-rules" href="/points-systems">Create or edit scoring rules →</a></small></label>
        <button id="reset-scenario" type="button">Reset entire scenario</button>
      </div>
      <div id="scenario-rules" class="scenario-rules" aria-live="polite"></div>
    </section>

    <section id="scenario-summary" class="scenario-summary" aria-label="Live championship outlook"><div class="loading-state">Loading championship outlook…</div></section>

    <section class="scenario-workspace">
      <div class="scenario-editor">
        <div class="section-heading"><div><div class="eyebrow">PREDICTIONS</div><h2>Edit a race result</h2></div><label class="scenario-race-choice"><span>Race</span><select id="scenario-race"></select></label></div>
        <div id="scenario-grid"><div class="empty-state">Choose a season to begin.</div></div>
      </div>
      <aside class="scenario-outlook">
        <div class="section-heading"><div><div class="eyebrow">TITLE OUTLOOK</div><h2>Projected standings</h2></div></div>
        <div id="scenario-standings"></div>
      </aside>
    </section>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/scenario-calculator.js"></script>
</body>
</html>
