<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse every FIA World Endurance Championship season in the Racelytic database.">
  <link rel="icon" href="/assets/favicon-wec.svg" type="image/svg+xml">
  <title>WEC Seasons · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/polish.css">
  <link rel="stylesheet" href="/css/seasons-overview.css">
</head>
<body class="wec-mode">
  <div id="header"></div>
  <main class="container page seasons-directory">
    <div class="page-head">
      <div>
        <h1>Seasons</h1>
      </div>
      <div class="season-filters" role="search" aria-label="Filter and sort WEC seasons">
        <div class="season-filter-field">
          <label for="season-search">Filter by year</label>
          <input id="season-search" type="search" inputmode="numeric" list="season-years" placeholder="Enter a year" autocomplete="off" aria-controls="seasons">
        </div>
        <div class="season-filter-field">
          <label for="season-sort">Order by</label>
          <select id="season-sort" aria-controls="seasons">
            <option value="desc" selected>Descending</option>
            <option value="asc">Ascending</option>
          </select>
        </div>
        <datalist id="season-years"></datalist>
      </div>
    </div>
    <div id="seasons" class="season-grid" aria-live="polite"></div>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/header.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/wec-seasons.js"></script>
</body>
</html>
