<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Racelytic</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css"></head>
<body><div id="header"></div><main class="container page analysis-detail-page records-page">
  <a class="back-link" href="/analysis">← Analysis</a><section class="analysis-detail-head"><div><div class="eyebrow">RECORDS EXPLORER</div><h1>Build your own record book.</h1><p>Rank drivers and constructors across any era, circuit, team or nationality.</p></div></section>
  <section class="records-explorer-controls">
    <div class="records-primary-controls"><div class="records-switch standings-mode" role="group"><button type="button" class="standings-mode-button active" data-record-type="drivers">Drivers</button><button type="button" class="standings-mode-button" data-record-type="constructors">Constructors</button></div><label><span>Record</span><select id="record-category"><option value="wins">Wins</option><option value="championships">Championships</option><option value="podiums">Podiums</option><option value="poles">Pole positions</option><option value="fastestLaps">Fastest laps</option><option value="points">Points</option><option value="starts">Starts</option><option value="gridGain">Average positions gained</option></select></label><button id="apply-record-filters" type="button">Explore records</button><button class="save-record-button" id="show-save-record" type="button">Save to record book</button></div>
    <button class="records-filter-toggle" id="records-filter-toggle" type="button" aria-expanded="true"><span>Advanced filters</span><small id="active-record-filter-count">No filters applied</small></button>
    <div class="records-advanced-filters" id="records-advanced-filters"><label><span>From season</span><input id="record-from-year" type="number" min="1950" placeholder="1950"></label><label><span>To season</span><input id="record-to-year" type="number" min="1950" placeholder="Present"></label><label><span>Circuit</span><select id="record-circuit"><option value="">All circuits</option></select></label><label id="record-constructor-label"><span>Constructor</span><select id="record-constructor"><option value="">All constructors</option></select></label><label><span>Nationality</span><select id="record-nationality"><option value="">All nationalities</option></select></label><label class="records-sprint-toggle"><input id="record-include-sprints" type="checkbox"><span><strong>Include sprint races</strong><small>Count sprint starts, wins, podiums and points</small></span></label><button id="reset-record-filters" type="button">Reset filters</button></div>
    <form class="save-record-panel" id="save-record-panel" hidden><div><span>PERSONAL RECORD BOOK</span><strong>Save this record definition</strong></div><label><span>Name</span><input id="save-record-name" maxlength="100" required placeholder="e.g. Monaco winners since 2000"></label><label><span>Visibility</span><select id="save-record-visibility"><option value="private">Private</option><option value="public">Public · share with the community</option></select></label><button type="submit">Save record</button><button type="button" id="cancel-save-record">Cancel</button><small id="save-record-message" aria-live="polite"></small></form>
  </section>
  <section id="record-explorer-summary" class="record-explorer-summary"></section>
  <section class="record-explorer-results"><div class="section-heading"><div><div class="eyebrow">RANKING</div><h2 id="record-results-title">Race wins</h2></div><div id="record-results-status" class="section-note"></div></div><div id="record-categories"><div class="loading-state">Loading records…</div></div></section>
</main><footer class="footer"><div class="container">Racelytic</div></footer><script src="/js/utils.js"></script><script src="/js/header.js"></script><script src="/js/records.js"></script></body></html>
