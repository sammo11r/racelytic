<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Racelytic</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css"></head>
<body><div id="header"></div><main class="container page analysis-detail-page driver-form-page"><a class="back-link" href="/analysis">← Analysis</a>
  <section class="analysis-detail-head"><div><div class="eyebrow">DRIVER FORM</div><h1>Performance is a moving target.</h1><p>Track recent pace, results, reliability and teammate performance across a driver’s latest races.</p></div><div class="driver-form-selectors"><label><span>Driver</span><select id="form-driver"><option>Loading drivers…</option></select></label><label><span>Race range</span><select id="form-range"><option value="5">Last 5 races</option><option value="10" selected>Last 10 races</option><option value="20">Last 20 races</option><option value="50">Last 50 races</option><option value="all">All available races</option></select></label><label><span>Rolling window</span><select id="form-window"><option value="3">3 races</option><option value="5" selected>5 races</option><option value="10">10 races</option></select></label></div></section>
  <section id="driver-form-summary" class="analysis-summary-strip"></section>
  <section class="analysis-visualization-menu"><div class="analysis-visualization-heading"><div class="eyebrow">FORM VIEW</div><strong>Choose an analysis</strong></div><div class="analysis-visualization-tabs driver-form-tabs"><button class="active" type="button" data-form-view="trend"><span>Form trend</span><small>Rolling positions</small></button><button type="button" data-form-view="teammates"><span>Teammates</span><small>Direct comparison</small></button><button type="button" data-form-view="circuits"><span>Circuits</span><small>Best and worst</small></button><button type="button" data-form-view="results"><span>Results</span><small>Selected races</small></button></div></section>
  <div class="analysis-visualization-workspace"><section data-form-panel="trend"><div id="driver-form-trend"></div></section><section data-form-panel="teammates" hidden><div id="driver-form-teammates"></div></section><section data-form-panel="circuits" hidden><div id="driver-form-circuits"></div></section><section data-form-panel="results" hidden><div id="driver-form-results"></div></section></div>
</main><footer class="footer"><div class="container">Racelytic</div></footer><script src="/js/utils.js"></script><script src="/js/header.js"></script><script src="/js/driver-form.js"></script></body></html>
