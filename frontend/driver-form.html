<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore recent driver form, qualifying pace, reliability, teammate comparisons and circuit performance.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Driver form · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css"><link rel="stylesheet" href="/css/driver-form.css">
</head>
<body><div id="header"></div>
<main class="container page analysis-detail-page driver-form-page">
  <header class="driver-form-head">
    <div class="driver-form-heading">
      <div class="eyebrow" id="form-series-label">FORMULA 1 · DRIVER FORM</div>
      <h1 id="form-title">Driver form</h1>
      <p id="form-meta">Recent results, qualifying pace, reliability and teammate performance.</p>
    </div>
    <div class="driver-form-selectors">
      <label class="driver-form-search"><span>Driver</span><input id="form-driver-search" type="search" list="form-driver-options" placeholder="Search drivers" autocomplete="off" disabled><datalist id="form-driver-options"></datalist><input id="form-driver" type="hidden"></label>
      <label><span>Race range</span><select id="form-range"><option value="5">Last 5 races</option><option value="10" selected>Last 10 races</option><option value="20">Last 20 races</option><option value="50">Last 50 races</option><option value="all">All available races</option></select></label>
      <label><span>Form line</span><select id="form-window"><option value="1">Raw results</option><option value="3">3-race average</option><option value="5" selected>5-race average</option><option value="10">10-race average</option></select></label>
    </div>
  </header>
  <p id="driver-form-status" class="analysis-status" role="status">Loading drivers…</p>
  <section id="driver-form-summary" class="analysis-summary-strip" aria-label="Driver form summary"></section>
  <div id="driver-form-workspace" hidden>
    <nav class="analysis-visualization-menu" aria-label="Driver form views">
      <label class="analysis-mobile-view" for="form-view">Analysis view<select id="form-view"><option value="trend">Form trend</option><option value="teammates">Teammates</option><option value="circuits">Circuits</option><option value="results">Results</option></select></label>
      <div class="analysis-visualization-tabs driver-form-tabs" role="tablist" aria-label="Driver form visualization">
        <button type="button" id="form-tab-trend" role="tab" aria-controls="form-panel-trend" aria-selected="true" data-form-view="trend">Form trend</button>
        <button type="button" id="form-tab-teammates" role="tab" aria-controls="form-panel-teammates" aria-selected="false" tabindex="-1" data-form-view="teammates">Teammates</button>
        <button type="button" id="form-tab-circuits" role="tab" aria-controls="form-panel-circuits" aria-selected="false" tabindex="-1" data-form-view="circuits">Circuits</button>
        <button type="button" id="form-tab-results" role="tab" aria-controls="form-panel-results" aria-selected="false" tabindex="-1" data-form-view="results">Results</button>
      </div>
    </nav>
    <div class="analysis-visualization-workspace">
      <section id="form-panel-trend" role="tabpanel" aria-labelledby="form-tab-trend" data-form-panel="trend"><div id="driver-form-trend"></div></section>
      <section id="form-panel-teammates" role="tabpanel" aria-labelledby="form-tab-teammates" data-form-panel="teammates" hidden><div id="driver-form-teammates"></div></section>
      <section id="form-panel-circuits" role="tabpanel" aria-labelledby="form-tab-circuits" data-form-panel="circuits" hidden><div id="driver-form-circuits"></div></section>
      <section id="form-panel-results" role="tabpanel" aria-labelledby="form-tab-results" data-form-panel="results" hidden><div id="driver-form-results"></div></section>
    </div>
  </div>
</main><footer class="footer"><div class="container">Racelytic</div></footer>
<script src="/js/utils.js"></script><script src="/js/header.js"></script><script src="/js/driver-form.js"></script>
</body></html>
