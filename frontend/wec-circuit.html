<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore FIA World Endurance Championship circuit history, layouts, race formats and overall winners.">
  <link rel="icon" href="/assets/favicon-wec.svg" type="image/svg+xml">
  <title>WEC Circuit · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/polish.css">
  <link rel="stylesheet" href="/css/wec.css">
</head>
<body class="wec-mode" data-wec-view="circuit">
  <div id="header"></div>
  <main class="container page wec-page wec-circuit-detail-page">
    <a id="wec-circuit-back" class="back-link" href="/wec/circuits"><span aria-hidden="true">←</span>All circuits</a>
    <div id="wec-circuit-load-status" role="status"></div>
    <div id="wec-circuit-hero" aria-busy="true"><div class="wec-circuit-detail-skeleton wec-circuit-hero-skeleton" aria-hidden="true"></div></div>

    <section class="wec-circuit-detail-facts" aria-label="Circuit facts">
      <dl id="wec-circuit-stats"><div class="wec-circuit-detail-skeleton" aria-hidden="true"></div></dl>
    </section>

    <section class="wec-circuit-detail-section" aria-labelledby="wec-circuit-records-title">
      <header class="section-heading"><div><p class="eyebrow">OVERALL VICTORIES</p><h2 id="wec-circuit-records-title">Most successful</h2></div></header>
      <div id="wec-circuit-records" class="wec-circuit-record-columns" aria-busy="true">
        <div class="wec-circuit-detail-skeleton" aria-hidden="true"></div>
        <div class="wec-circuit-detail-skeleton" aria-hidden="true"></div>
        <div class="wec-circuit-detail-skeleton" aria-hidden="true"></div>
      </div>
    </section>

    <section class="wec-circuit-detail-section" aria-labelledby="wec-circuit-history-title">
      <header class="section-heading wec-circuit-history-heading">
        <div><p class="eyebrow">ENDURANCE HISTORY</p><h2 id="wec-circuit-history-title">WEC races</h2></div>
        <span id="wec-circuit-history-count" class="section-note" aria-live="polite">Loading races…</span>
      </header>
      <div class="wec-circuit-history-filters" role="search" aria-label="Filter circuit race history">
        <label class="wec-circuit-history-search"><span>Search</span><input id="wec-circuit-history-search" type="search" placeholder="Race, team, manufacturer or driver…"></label>
        <label><span>Season</span><select id="wec-circuit-history-season"><option value="all">All seasons</option></select></label>
        <label><span>Format</span><select id="wec-circuit-history-format"><option value="all">All formats</option><option value="24h">24 hours</option><option value="8h">8 hours</option><option value="6h">6 hours</option><option value="distance">Distance race</option><option value="other">Other duration</option></select></label>
        <label><span>Order by</span><select id="wec-circuit-history-sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
        <button type="button" id="wec-circuit-history-clear" class="button secondary">Clear filters</button>
      </div>
      <div id="wec-circuit-events" class="wec-circuit-event-list" aria-busy="true">
        <article class="wec-circuit-detail-skeleton wec-circuit-event-skeleton" aria-hidden="true"></article>
        <article class="wec-circuit-detail-skeleton wec-circuit-event-skeleton" aria-hidden="true"></article>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/wec-circuit.js"></script>
</body>
</html>
