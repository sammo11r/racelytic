<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Traffic Monitor · Racelytic</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css"></head>
<body><main class="container page monitor-page">
  <div class="page-head"><div><div class="eyebrow">PRIVATE DASHBOARD</div><h1>Traffic monitor</h1><p>Anonymous first-party traffic and active reading time.</p></div><label class="sort-control">Period <select id="monitor-days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">1 year</option></select></label></div>
  <div id="monitor-error"></div>
  <section id="monitor-summary" class="stats-grid"></section>
  <section class="detail-section"><div class="section-heading"><div><div class="eyebrow">TRAFFIC</div><h2>Daily visits</h2></div></div><div id="monitor-daily" class="table-wrap"></div></section>
  <section class="detail-section"><div class="section-heading"><div><div class="eyebrow">CONTENT</div><h2>Top pages</h2></div></div><div id="monitor-pages" class="table-wrap"></div></section>
  <section class="detail-section"><div class="section-heading"><div><div class="eyebrow">LIVE LOG</div><h2>Recent visits</h2></div><div class="section-note">Latest 100</div></div><div id="monitor-recent" class="table-wrap"></div></section>
</main><script src="/js/utils.js"></script><script src="/js/monitor.js"></script></body>
</html>
