<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Racelytic</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
    <link rel="stylesheet" href="/css/polish.css">
    <link rel="stylesheet" href="/css/seasons-overview.css">

</head>


<body>

    <div id="header"></div>


    <main class="container page seasons-directory">

        <div class="page-head">

            <div>

                <div class="eyebrow">
                    CHAMPIONSHIP HISTORY
                </div>

                <h1>
                    Seasons
                </h1>

            </div>

            <div class="season-filters" role="search" aria-label="Filter and sort seasons">
                <div class="season-filter-field">
                    <label for="season-search">Filter by year</label>
                    <input
                        id="season-search"
                        type="search"
                        inputmode="numeric"
                        list="season-years"
                        placeholder="Enter a year"
                        autocomplete="off"
                        aria-controls="seasons"
                    >
                </div>
                <div class="season-filter-field">
                    <label for="season-sort">order by</label>
                    <select id="season-sort" aria-controls="seasons">
                        <option value="desc" selected>Descending</option>
                        <option value="asc">Ascending</option>
                    </select>
                </div>
                <datalist id="season-years"></datalist>
            </div>

        </div>


        <div
            id="seasons"
            class="season-grid"
        >
        </div>

    </main>


    <footer class="footer">

        <div class="container">
            Racelytic
        </div>

    </footer>


    <script src="/js/header.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/seasons.js"></script>

</body>

</html>
