<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Racelytic</title>
  <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css">
</head>
<body>
  <div id="header"></div>
  <main class="container page races-page">
    <div class="page-head"><div><div class="eyebrow">GRAND PRIX ARCHIVE</div><h1>Races</h1><p>Every Formula 1 race, from the first championship round through the current calendar.</p></div></div>
    <section class="race-filters f1-race-filters" aria-label="Race archive filters">
      <div class="race-filter-primary">
        <label class="race-search-filter"><span>Filter races</span><input id="race-search" type="search" placeholder="Race, circuit or country"></label>
        <label><span>Season</span><select id="race-year"><option value="">All seasons</option></select></label>
        <label class="race-circuit-filter"><span>Circuit</span><input id="race-circuit" type="search" list="race-circuit-options" placeholder="All circuits" autocomplete="off"><datalist id="race-circuit-options"></datalist></label>
      </div>
      <details class="race-more-filters" id="race-more-filters" open>
        <summary>More filters <span id="race-more-filter-count"></span></summary>
        <div class="race-filter-advanced">
          <label><span>Status</span><select id="race-status"><option value="">All statuses</option><option value="upcoming">Upcoming</option><option value="completed">Completed</option><option value="no-result">No result</option></select></label>
          <label><span>Weekend</span><select id="race-weekend"><option value="">All weekends</option><option value="sprint">Sprint weekends</option><option value="standard">Standard weekends</option></select></label>
          <label><span>Order</span><select id="race-sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
        </div>
      </details>
      <button id="clear-race-filters" class="button race-clear-filters" type="button" disabled>Clear filters</button>
    </section>
    <div id="race-active-filters" class="race-active-filters" aria-label="Active filters"></div>
    <div id="race-browser-heading" class="race-browser-heading" aria-live="polite"><strong id="race-count">Loading races…</strong><span id="race-filter-note"></span></div>
    <div id="races" class="race-archive" aria-busy="true"><div class="race-archive-loading">Loading the race archive…</div></div>
    <nav id="races-pagination" class="pagination race-season-pagination" aria-label="Race archive pages"></nav>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script><script src="/js/header.js"></script><script src="/js/races.js"></script>
</body>
</html>
