<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore a Formula 2 constructor’s history in Racelytic.">
  <link rel="icon" href="/assets/favicon-f2.svg" type="image/svg+xml">
  <title>Formula 2 Constructor · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/polish.css">
</head>
<body class="f2-mode">
  <div id="header"></div>
  <main class="container page">
    <a class="back-link" href="/f2/constructors"><span aria-hidden="true">←</span>All constructors</a>
    <div id="f2-constructor-head"></div>
    <section class="detail-section"><div class="section-heading"><div><div class="eyebrow">RECORD</div><h2>At a glance</h2></div></div><div id="f2-constructor-stats" class="detail-stat-grid"></div></section>
    <section class="detail-section"><div class="section-heading"><div><div class="eyebrow">CAREER TIMELINE</div><h2>Season by season</h2></div><div id="f2-constructor-career-span" class="section-note"></div></div><div id="f2-constructor-seasons"></div></section>
    <section class="detail-section"><div class="section-heading"><div><div class="eyebrow">DRIVERS</div><h2>Every driver</h2></div><div id="f2-constructor-driver-count" class="section-note"></div></div><div id="f2-constructor-drivers" class="constructor-driver-grid"></div></section>
    <section class="detail-section"><div class="section-heading"><div><div class="eyebrow">RESULTS</div><h2>Recent race results</h2></div><div class="section-note">Latest 250 entries</div></div><div id="f2-constructor-results" class="table-wrap detail-results"></div></section>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/f2-constructor.js"></script>
</body>
</html>
