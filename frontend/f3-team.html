<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Explore a Formula 3 team’s seasons, drivers and complete race history."><link rel="icon" href="/assets/favicon-f3.svg" type="image/svg+xml"><title>Team · Formula 3 · Racelytic</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/polish.css"></head>
<body class="f3-mode">
<div id="header"></div>
<main class="container page constructor-detail-page junior-constructor-detail-page">
  <a id="constructor-back-link" class="back-link" href="/f3/teams"><span aria-hidden="true">←</span>All teams</a>
  <div id="constructor-load-status" role="status"></div>
  <div id="constructor-head" aria-busy="true"><div class="circuit-detail-skeleton circuit-hero-placeholder" aria-hidden="true"></div></div>
  <nav class="constructor-section-nav" aria-label="Team sections"><a href="#constructor-record">Career</a><a href="#constructor-career">Seasons</a><a href="#constructor-people">Drivers</a><a href="#constructor-history">Race history</a></nav>
  <section id="constructor-record" class="constructor-record-section" aria-label="Career statistics">
    <div id="constructor-stats" aria-busy="true"><div class="circuit-detail-skeleton" aria-hidden="true"></div></div>
  </section>
  <section id="constructor-career" class="constructor-plain-section" aria-labelledby="constructor-career-title">
    <header class="section-heading"><div><div class="eyebrow">TIMELINE</div><h2 id="constructor-career-title">Season by season</h2></div><span id="constructor-career-span" class="section-note"></span></header>
    <div class="constructor-timeline-controls"><label>Jump to season <select id="constructor-timeline-year"><option value="">Latest season</option></select></label><button id="constructor-timeline-latest" class="button secondary" type="button">Latest season</button></div>
    <div id="constructor-seasons" aria-busy="true"><div class="circuit-detail-skeleton" aria-hidden="true"></div></div>
  </section>
  <section id="constructor-people" class="constructor-plain-section" aria-labelledby="constructor-people-title">
    <header class="section-heading"><div><div class="eyebrow">DRIVERS</div><h2 id="constructor-people-title">Every driver</h2></div><span id="constructor-driver-count" class="section-note" aria-live="polite"></span></header>
    <p id="constructor-driver-note" class="section-note">Career totals with this team. Season filters select drivers, not the period covered by their totals.</p>
    <div class="constructor-detail-filters" role="search" aria-label="Filter team drivers">
      <label><span>Search drivers</span><input id="constructor-driver-search" type="search" class="search" placeholder="Driver name…" autocomplete="off"></label>
      <label><span>Season</span><select id="constructor-driver-season"><option value="">All seasons</option></select></label>
      <label><span>Order by</span><select id="constructor-driver-sort"><option value="recent">Most recent</option><option value="name">Name A–Z</option><option value="starts">Most starts</option><option value="wins">Most wins</option></select></label>
      <button id="constructor-driver-clear" type="button" class="button secondary">Clear filters</button>
    </div>
    <div id="constructor-drivers" class="constructor-driver-grid" aria-busy="true"><div class="circuit-detail-skeleton" aria-hidden="true"></div></div>
  </section>
  <section id="constructor-history" class="constructor-plain-section" aria-labelledby="constructor-history-title">
    <header class="section-heading"><div><div class="eyebrow">RACE RESULTS</div><h2 id="constructor-history-title">Race history</h2></div><span id="constructor-result-count" class="section-note" aria-live="polite">Loading races…</span></header>
    <div class="constructor-detail-filters" role="search" aria-label="Filter team race history">
      <label><span>Search races</span><input id="constructor-result-search" class="search" type="search" placeholder="Race or circuit…" autocomplete="off"></label>
      <label><span>Season</span><select id="constructor-result-season"><option value="">All seasons</option></select></label>
      <label><span>Driver</span><select id="constructor-result-driver"><option value="">All drivers</option></select></label>
      <button id="constructor-result-clear" type="button" class="button secondary">Clear filters</button>
    </div>
    <div id="constructor-results-status" role="status"></div>
    <div id="constructor-results" aria-busy="true"><div class="circuit-detail-skeleton circuit-history-placeholder" aria-hidden="true"></div></div>
  </section>
</main>
<footer class="footer"><div class="container">Racelytic</div></footer>
<script src="/js/utils.js"></script>
<script src="/js/header.js"></script>
<script src="/js/constructor.js"></script>
</body></html>
