<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Racelytic</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/polish.css">
</head>
<body>
  <div id="header"></div>
  <main class="container page race-detail-page">
    <div class="race-page-navigation">
      <a class="back-link" href="/races"><span aria-hidden="true">←</span>All races</a>
      <nav id="race-round-navigation" class="race-round-navigation" aria-label="Previous and next race"></nav>
    </div>
    <section id="race-head" aria-busy="true"><div class="loading-state race-detail-loading">Loading race weekend…</div></section>
    <section id="race-overview" class="race-overview" aria-live="polite"></section>
    <section id="race-session-results" class="race-session-results" hidden>
    <header class="race-session-header">
      <div><div class="eyebrow">WEEKEND RESULTS</div><h2 id="session-title">Race classification</h2></div>
      <div id="session-tabs" class="standings-mode race-session-tabs" role="tablist" aria-label="Race sessions"></div>
    </header>
    <div id="session-variants" class="session-variants" role="group" aria-label="Session classifications"></div>
    <section id="race-results" class="race-results-panel" role="tabpanel" aria-live="polite"></section>
    </section>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/race.js"></script>
</body>
</html>
