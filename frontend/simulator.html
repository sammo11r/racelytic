<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recalculate any Formula 1 season with historical or custom scoring and compare the championship outcome.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>Simulate a Formula 1 season · Racelytic</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/polish.css">
  <link rel="stylesheet" href="/css/simulator-season.css">
</head>
<body>
  <div id="header"></div>
  <main class="container page simulator-page">
    <header class="simulator-page-heading">
      <div class="eyebrow">SIMULATE A SEASON</div>
      <h1>Recalculate a championship</h1>
      <p>Apply different scoring and championship rules, then compare the result with the official standings.</p>
    </header>

    <section class="simulator-workspace" aria-label="Simulation settings">
      <div class="simulator-controls">
      <label>
        <span>Season</span>
        <select id="simulation-season"><option value="">Loading seasons…</option></select>
      </label>
      <label class="ruleset-control">
        <span>Points system</span>
        <select id="simulation-points"></select>
        <small><a id="manage-points-systems" href="/points-systems">Create or edit scoring rules →</a></small>
      </label>
      </div>
      <section id="simulation-explanation" class="simulation-explanation" aria-label="Selected scoring rules" aria-live="polite"></section>
    </section>

    <section class="simulator-results">
      <div class="section-heading">
        <div><div class="eyebrow">RECALCULATED</div><h2 id="simulation-championship-title">Driver championship</h2></div>
        <div class="simulation-heading-actions">
          <div class="standings-mode" role="group" aria-label="Championship standings">
            <button class="standings-mode-button active" type="button" data-simulation-mode="drivers" aria-pressed="true">Drivers</button>
            <button class="standings-mode-button" type="button" data-simulation-mode="constructors" aria-pressed="false">Constructors</button>
          </div>
          <label class="simulation-change-filter"><input id="simulation-changes-only" type="checkbox"><span>Changed positions only</span></label>
          <div id="simulation-status" class="section-note"></div>
        </div>
      </div>
      <div id="simulation-summary" class="simulation-summary"></div>
      <div id="simulation-results" class="table-wrap simulation-table-wrap">
        <div class="empty-state">Choose your settings and run the simulation.</div>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container">Racelytic</div></footer>
  <script src="/js/utils.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/f1-points-systems.js"></script>
  <script src="/js/simulator.js"></script>
</body>
</html>
